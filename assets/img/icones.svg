  <!-- Sprite de ícones. Uso no HTML (ex.: ícone do WhatsApp):
         svg com use href="/assets/img/icones.svg#whatsapp" dentro
       Um arquivo só, baixado uma vez e guardado em cache pelo navegador.

       Por que "s:svg" e não "svg"? A extensão Live Server do VS Code injeta um script
       antes da primeira tag de fechamento de svg que encontra em arquivos .svg, e isso
       quebra o arquivo inteiro (os ícones somem). Com o prefixo "s:" a tag continua
       sendo um svg normal para o navegador (o prefixo aponta para o mesmo namespace),
       mas o Live Server não a reconhece. Por isso também: não escreva a tag de
       fechamento de svg em nenhum comentário deste arquivo. -->
